name: 드릴 음성 만들기

on:
  push:
    branches: [main]
    paths: [cards.json, private.enc, tools/make_audio.py, .github/workflows/audio.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drill-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: VOICEVOX 엔진 켜기
        run: |
          IMG=voicevox/voicevox_engine:cpu-latest
          docker pull -q $IMG || { IMG=voicevox/voicevox_engine:cpu-ubuntu20.04-latest; docker pull -q $IMG; }
          docker run -d --rm -p 50021:50021 $IMG
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-cryptography
      - name: 음성 파일 만들기
        env:
          DRILL_KEY: ${{ secrets.DRILL_KEY }}
        run: |
          mkdir -p audio
          python3 tools/make_audio.py > audio/_run.log 2>&1 || echo "exit=$?" >> audio/_run.log
          tail -c 4000 audio/_run.log > audio/_t.log; mv audio/_t.log audio/_run.log
      - name: 음성 파일 올리기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio; [ -d paudio ] && git add -A paudio || true
          if git diff --cached --quiet; then echo "새 음성 없음"; exit 0; fi
          git commit -m "드릴 음성 파일 업데이트"
          git pull --rebase origin main
          git push
