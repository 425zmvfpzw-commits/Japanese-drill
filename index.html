<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2B3E73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일본어드릴">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>일본어드릴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Shippori+Mincho:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-column phone app, fixed bottom tab bar, one card in focus at a time */
:root{
  --bg:#EEF0F2; --surface:#FFFFFF; --ink:#1B2233; --muted:#6B7284; --faint:#A3A9B6;
  --line:#D9DDE3; --indigo:#2B3E73; --indigo-soft:#E2E7F3; --shu:#D2372A; --shu-soft:#FBE7E4;
  --star:#F2B705; --ok:#1E8A5A; --ok-soft:#E1F3EA; --on-accent:#FFFFFF;
  --f-ja:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151C; --surface:#1C212C; --ink:#E8EAF0; --muted:#9AA1B2; --faint:#6E7586;
  --line:#2C3342; --indigo:#8EA4E8; --indigo-soft:#253052; --shu:#FF6A5C; --shu-soft:#3A1F1E;
  --star:#FFC933; --ok:#4FC98D; --ok-soft:#173327; --on-accent:#12151C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151C; --surface:#1C212C; --ink:#E8EAF0; --muted:#9AA1B2; --faint:#6E7586;
  --line:#2C3342; --indigo:#8EA4E8; --indigo-soft:#253052; --shu:#FF6A5C; --shu-soft:#3A1F1E;
  --star:#FFC933; --ok:#4FC98D; --ok-soft:#173327; --on-accent:#12151C; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(86px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
header.top h1{font-size:19px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
header.top h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.02em}
.status-col{display:grid;justify-items:end;gap:4px}
.net{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.net.on{color:var(--ok);border-color:var(--ok)}
.sync{font-size:11px;color:var(--muted);white-space:nowrap}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,label:focus-within{outline:2px solid var(--indigo);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.section-title{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--on-accent)}
.chip .n{font-family:var(--f-num);font-size:11px;opacity:.75}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:12px;padding:10px 12px;font-size:13px;background:var(--indigo-soft);color:var(--ink)}
.banner.warn{background:var(--shu-soft)}

/* segmented */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:10px;padding:9px 6px;font-weight:500;color:var(--muted);display:inline-flex;justify-content:center;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--indigo);color:var(--on-accent)}
.cnt{font-family:var(--f-num);font-size:11px;border-radius:99px;padding:1px 7px;background:var(--shu);color:var(--on-accent)}

/* toggle picker with scroll */
.picker{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}
.pk-head{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;background:none;padding:12px 16px;text-align:left}
.pk-head b{font-size:14px}
.pk-sum{font-size:13px;color:var(--muted);margin-left:auto}
.pk-head svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .2s}
.pk-head[aria-expanded="true"] svg{transform:rotate(180deg)}
.pk-body{border-top:1px solid var(--line)}
.pk-list{max-height:236px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--faint) transparent}
.pk-list::-webkit-scrollbar{width:6px}
.pk-list::-webkit-scrollbar-thumb{background:var(--faint);border-radius:6px}
.pk-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;cursor:pointer}
.pk-row + .pk-row{border-top:1px solid var(--line)}
.pk-row.all{background:var(--bg);font-weight:700}
.pk-row .lbl{min-width:0}
.pk-row .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.pk-row .n{font-family:var(--f-num);font-size:11px;color:var(--muted);margin-left:6px}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw:checked{background:var(--indigo)}
.sw:checked::after{transform:translateX(18px)}
.pk-more{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 6px;border-top:1px solid var(--line)}

/* card */
.stage{position:relative;margin-top:12px;display:flex;flex-direction:column;align-items:stretch}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 10px 30px -18px rgba(20,30,60,.35);touch-action:none;user-select:none;transition:transform .25s ease,opacity .25s ease}
.card.dragging{transition:none}
.card .count{position:absolute;top:10px;right:14px;font-size:10pt;font-family:var(--f-num);color:var(--muted)}
.card .date{position:absolute;top:10px;left:16px;font-size:10pt;font-family:var(--f-num);color:var(--indigo);font-weight:500}
.card.has-date .sit,.card.has-check .sit{margin-top:18px}
.card .check{position:absolute;top:6px;left:50%;transform:translateX(-50%);border:0;background:none;padding:4px;line-height:0}
.card .check svg{width:28px;height:28px}
.card .check circle{fill:none;stroke:var(--faint);stroke-width:1.6}
.card .check path{fill:none;stroke:var(--faint);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.card .check.on circle{fill:var(--shu);stroke:var(--shu)}
.card .check.on path{stroke:var(--surface)}
.card .sit{font-size:12px;color:var(--indigo);font-weight:700;letter-spacing:.03em;padding-right:44px}
.card .stagelbl{font-size:12px;color:var(--muted);margin-top:2px}
.card .ja{font-family:var(--f-ja);font-size:25px;line-height:1.5;font-weight:500;margin:16px 0 4px;word-break:break-word;text-wrap:pretty}
.card .pron{color:var(--faint);font-size:14px;margin:0 0 14px}
.card .ko{font-size:17px;margin:0;font-weight:500;word-break:keep-all}
.card.ask .ko{margin-top:16px;font-size:20px}
.card mark{background:none;color:var(--shu);font-weight:700}
.card .tools{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.card .speak{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:7px 14px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.card .star{display:block;margin:14px auto 0;border:0;background:none;padding:4px;line-height:0}
.card .star svg{width:30px;height:30px}
.card .star path{fill:none;stroke:var(--faint);stroke-width:1.6}
.card .star.on path{fill:var(--star);stroke:var(--star)}
.card .status{font-size:12px;color:var(--muted)}
.card .hidden-ans{margin-top:14px;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center;color:var(--faint);font-size:14px}
.fb{margin-top:16px;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px;font-size:14px;user-select:text}
.fb h4{margin:0;font-size:12px;color:var(--shu);letter-spacing:.03em}
.fb .said{background:var(--shu-soft);border-radius:10px;padding:8px 10px}
.fb p{margin:0}
.fb .lv{font-family:var(--f-num);font-size:11px;color:var(--muted)}
.swipe-hint{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);margin-top:10px}
.deck-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.badge{font-size:11px;border-radius:99px;padding:2px 8px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.badge.known{color:var(--ok);border-color:var(--ok)}
.badge.again{color:var(--shu);border-color:var(--shu)}
.badge.mine{color:var(--indigo);border-color:var(--indigo)}
.badge.done{color:var(--surface);background:var(--shu);border-color:var(--shu)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}
.ladder div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;font-size:12px;color:var(--muted)}
.ladder b{display:block;font-family:var(--f-num);font-size:16px;color:var(--ink)}

/* quiz */
.choice{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.opt[aria-pressed="true"]{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo)}
.opt b{display:block;font-size:16px}
.opt span{font-size:13px;color:var(--muted)}
.opt:disabled{opacity:.5}
.timer{width:88px;height:88px;margin:4px auto 0;position:relative}
.timer .face{position:absolute;inset:0;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.timer .disc{position:absolute;inset:8px;border-radius:50%;background:conic-gradient(var(--shu) calc(var(--p,1) * 1turn), transparent 0)}
.timer .ticks{position:absolute;inset:0}
.timer .hub{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink)}
.timer .sec{position:absolute;left:0;right:0;bottom:-22px;text-align:center;font-family:var(--f-num);font-size:12px;color:var(--muted)}
.quizbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:6px}
.answerbox{display:grid;gap:8px;margin-top:12px}
.answerbox textarea{width:100%;min-height:70px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 12px;font:inherit;resize:vertical}
.result{border-radius:12px;padding:10px 12px;font-weight:700;text-align:center;margin-bottom:10px}
.result.ok{background:var(--ok-soft);color:var(--ok)}
.result.ng{background:var(--shu-soft);color:var(--shu)}

/* list */
.search{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit}
details.cat{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-top:10px;overflow:hidden}
details.cat summary{list-style:none;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;font-weight:700}
details.cat summary::-webkit-details-marker{display:none}
details.cat summary .n{font-family:var(--f-num);font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.li{border-top:1px solid var(--line);padding:12px 16px;display:grid;gap:2px;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.li .lja{font-family:var(--f-ja);font-size:17px}
.li .lko{font-size:13px;color:var(--muted)}
.li .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.li mark{background:var(--shu-soft);color:inherit}
.li .lstar{color:var(--star);font-size:14px}
.cat-actions{padding:8px 16px 12px;border-top:1px solid var(--line);display:flex;justify-content:flex-end}
.danger{color:var(--shu)}

/* add */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;margin-top:10px}
.panel h3{margin:0;font-size:15px}
.panel .picker{margin-top:0;background:var(--bg)}
.field{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit}
textarea.field{min-height:90px;resize:vertical}
.log{font-size:13px;color:var(--muted);white-space:pre-wrap;margin:0}
.file-pill{font-size:13px;background:var(--bg);border-radius:8px;padding:6px 10px}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(10,14,24,.5);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding-top:env(safe-area-inset-top,0px)}
.sheet-inner{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.confirm{display:grid;gap:10px}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:20}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:520px}
nav.tabs button{position:relative;border:0;background:none;padding:6px 0;display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--indigo);font-weight:700}
nav.tabs .dot{position:absolute;top:2px;left:calc(50% + 6px);font-family:var(--f-num);font-size:10px;min-width:17px;padding:0 4px;border-radius:99px;background:var(--shu);color:var(--on-accent);line-height:16px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:40;max-width:90%;text-align:center}
/* listening drill */
.drill{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(16px,env(safe-area-inset-left,0px))}
.drill-in{max-width:520px;margin:0 auto;display:grid;gap:14px}
.drill .x{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:max(16px,env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;z-index:2}
.drill .x svg{width:18px;height:18px;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.drill-top{padding-right:52px}
.drill-top b{display:block;font-size:13px;color:var(--indigo)}
.drill-top span{font-size:12px;color:var(--muted);font-family:var(--f-num)}
.drill .card{touch-action:pan-y;user-select:text}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.dots i{height:8px;border-radius:4px;background:var(--line)}
.dots i.on{background:var(--shu)}
.dots i.now{background:var(--indigo)}
.speed{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted)}
.speed b{font-family:var(--f-num);font-size:22px;color:var(--ink);font-weight:500}
.ctrls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px}
.ctrls .btn{padding:14px 8px}
.drill-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.drill-bar i{display:block;height:100%;background:var(--indigo);width:0}
.gear{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.gear svg{width:17px;height:17px;fill:none;stroke:var(--muted);stroke-width:1.7}
.vopt{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.vopt[aria-checked="true"]{border-color:var(--indigo);box-shadow:inset 0 0 0 1px var(--indigo)}
.vopt .vlbl{flex:1;min-width:0;text-align:left;border:0;background:none;padding:4px 0}
.vopt .vlbl b{display:block;font-size:15px}
.vopt .vlbl small{color:var(--muted);font-size:12px}
.vopt .play{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.card,.pk-head svg,.sw,.sw::after{transition:none}}
</style>

<div class="app">
  <header class="top">
    <h1>일본어드릴<small>現場で使う必須フレーズ</small></h1>
    <div class="status-col"><div class="row" style="gap:6px;flex-wrap:nowrap"><span class="net" id="net">확인 중</span><button class="gear" id="gear" type="button" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div><span class="sync" id="sync"></span></div>
  </header>
  <main id="view"></main>

/* ---------- 기본 카드 ---------- */

const EX = [
 {name:"비즈니스 인사", desc:"메일·전화에서 쓰는 기본 인사말", src:"기본 예시", items:[

  ["初めてご連絡いたします。","하지메테 고렌라쿠 이타시마스","처음 연락드립니다.",[["初めて","처음"],["ご連絡","연락"]]],
  ["お忙しいところ恐れ入ります。","오이소가시이 토코로 오소레이리마스","바쁘신 와중에 죄송합니다.",[["お忙しいところ","바쁘신 와중에"],["恐れ入ります","죄송합니다"]]],
  ["お時間をいただきありがとうございます。","오지칸오 이타다키 아리가토- 고자이마스","시간 내주셔서 감사합니다.",[["お時間","시간"]]],
  ["今後ともよろしくお願いいたします。","콘고토모 요로시쿠 오네가이 이타시마스","앞으로도 잘 부탁드립니다.",[["今後とも","앞으로도"]]],
  ["ご確認のほど、よろしくお願いいたします。","고카쿠닌노 호도 요로시쿠 오네가이 이타시마스","확인 부탁드립니다.",[["ご確認のほど","확인"]]],
  ["取り急ぎ、ご連絡まで。","토리이소기 고렌라쿠마데","우선 급히 연락드립니다.",[["取り急ぎ","우선 급히"]]],
  ["ご返信が遅くなり、申し訳ございません。","고헨신가 오소쿠나리 모-시와케 고자이마센","답장이 늦어져 죄송합니다.",[["ご返信","답장"],["申し訳ございません","죄송합니다"]]],
  ["承知いたしました。","쇼-치 이타시마시타","알겠습니다.",[["承知いたしました","알겠습니다"]]],
  ["引き続きよろしくお願いいたします。","히키츠즈키 요로시쿠 오네가이 이타시마스","계속해서 잘 부탁드립니다.",[["引き続き","계속해서"]]]
 ]},

];
function newCard(id, sid, d, extra={}){
  return Object.assign({id, sid, ja:String(d.ja||""), pron:String(d.pron||""), ko:String(d.ko||""),
    words:Array.isArray(d.words)?d.words.filter(w=>w&&w.ja).map(w=>({ja:String(w.ja),ko:String(w.ko||"")})).slice(0,4):[],
    shows:0, status:"new", fav:false, wrong:0, fb:null, mine:false, rv:null, mastered:false, created:Date.now(), order:Math.random()}, extra);
}
function seed(){
  const s = {v:2, savedAt:0, sits:{}, cards:{}, studySel:[], pending:null, pendingSel:[]};
  EX.forEach(g => {
    const sid = "s-" + fnv(g.name); s.sits[sid] = {id:sid, name:g.name, desc:g.desc, source:g.src || SRC, created:0};
    g.items.forEach(([ja,pron,ko,w]) => { const id = "c-" + fnv(ja); s.cards[id] = newCard(id,sid,{ja,pron,ko,words:w.map(([j,k])=>({ja:j,ko:k}))}, {created:0}); });
    s.studySel.push(sid);
  });
  return s;
}

/* ---------- 이 기기 저장 + Claude 계정 자동 백업 ---------- */
const KEY = "nihongo-cards.v2";
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !S.sits) {
  S = seed();
  try { // 지난 버전에서 직접 만든 카드는 옮겨 오기
    const old = JSON.parse(localStorage.getItem("nihongo-cards.v1"));
    if (old && old.sits) Object.values(old.sits).filter(x=>!x.example).forEach(x => {
      S.sits[x.id] = x; Object.values(old.cards||{}).filter(c=>c.sid===x.id).forEach(c => S.cards[c.id] = Object.assign({rv:null, mastered:false}, c));
      S.savedAt = 1;
    });
  } catch(e) {}
}
Object.values(S.cards).forEach(c => { if (c.rv === undefined) c.rv = null; if (c.mastered === undefined) c.mastered = false; });

if (!S.deleted) S.deleted = {};
/* 카드·상황마다 마지막으로 바뀐 시각(upd)을 붙여서, 폰 앱과 작업실의 기록을 카드 단위로 합친다 */
const snapJ = {};
const bare = o => { const c = Object.assign({}, o); delete c.upd; return JSON.stringify(c); };
function stamp(init){
  const now = Date.now();
  [S.sits, S.cards].forEach(m => Object.values(m).forEach(o => {
    const j = bare(o);
    if (snapJ[o.id] !== j) { if (!init || !o.upd) o.upd = init ? (o.upd || o.created || now) : now; snapJ[o.id] = j; }
  }));
}
stamp(true);
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
function save(){ stamp(false); S.savedAt = Date.now(); saveLocal(); queuePush(); updateDue(); }
const DUPS_FIXED = dedupe();
if (DUPS_FIXED) { stamp(false); S.savedAt = Date.now(); }
saveLocal();
function forget(kind, id){ S.deleted[id] = Date.now(); delete S[kind][id]; delete snapJ[id]; }
/* 같은 이름의 상황, 같은 상황 안의 같은 문장은 하나로 합친다 (공부 기록이 더 많은 쪽을 남김) */
function dedupe(){
  let n = 0;
  const score = c => (c.shows||0) + (c.wrong||0)*2 + (c.rv ? 5 + (c.rv.stage||0)*5 : 0) + (c.mastered?50:0) + (c.fav?1:0) + (c.fb?3:0);
  const byName = {};
  Object.values(S.sits).forEach(x => { (byName[x.name.trim()] = byName[x.name.trim()] || []).push(x); });
  Object.values(byName).forEach(group => {
    if (group.length < 2) return;
    const total = x => Object.values(S.cards).filter(c => c.sid === x.id).reduce((a,c) => a + score(c), 0);
    group.sort((a,b) => total(b) - total(a) || (a.id.startsWith("s-") ? -1 : 1));
    const keep = group[0];
    group.slice(1).forEach(x => {
      Object.values(S.cards).forEach(c => { if (c.sid === x.id) { c.sid = keep.id; } });
      if (S.studySel.includes(x.id) && !S.studySel.includes(keep.id)) S.studySel.push(keep.id);
      if (S.drillSel && S.drillSel.includes(x.id) && !S.drillSel.includes(keep.id)) S.drillSel.push(keep.id);
      forget("sits", x.id); n++;
    });
  });
  const byKey = {};
  Object.values(S.cards).forEach(c => { const k = c.sid + "|" + c.ja.trim(); (byKey[k] = byKey[k] || []).push(c); });
  Object.values(byKey).forEach(group => {
    if (group.length < 2) return;
    group.sort((a,b) => score(b) - score(a) || (b.upd||0) - (a.upd||0));
    const keep = group[0];
    group.slice(1).forEach(c => { if (c.fav) keep.fav = true; keep.wrong = Math.max(keep.wrong||0, c.wrong||0); keep.shows = Math.max(keep.shows||0, c.shows||0); forget("cards", c.id); n++; });
  });
  S.studySel = [...new Set(S.studySel)].filter(id => S.sits[id]);
  if (S.drillSel) S.drillSel = [...new Set(S.drillSel)].filter(id => S.sits[id]);
  return n;
}
/* 다른 쪽 기록을 합치기: 카드마다 더 최근에 바뀐 쪽을 남긴다. 반환값: 바뀐 개수 */
function mergeState(o){
  if (!o || !o.sits || !o.cards) return -1;
  let n = 0;
  const del = Object.assign({}, o.deleted||{});
  Object.entries(del).forEach(([id, t]) => { S.deleted[id] = Math.max(S.deleted[id]||0, t); });
  const take = (kind, x) => {
    const mine = S[kind][x.id], dt = S.deleted[x.id] || 0;
    if ((x.upd||0) <= dt) return;
    if (!mine || (x.upd||0) > (mine.upd||0)) { S[kind][x.id] = JSON.parse(JSON.stringify(x)); snapJ[x.id] = bare(x); n++; }
  };
  Object.values(o.sits).forEach(x => take("sits", x));
  Object.values(o.cards).forEach(x => take("cards", Object.assign({rv:null, mastered:false}, x)));
  ["sits","cards"].forEach(kind => Object.values(S[kind]).forEach(x => { const dt = S.deleted[x.id]; if (dt && (x.upd||0) <= dt) { delete S[kind][x.id]; n++; } }));
  if ((o.savedAt||0) > (S.savedAt||0)) { S.studySel = (o.studySel||[]).slice(); S.pending = o.pending ? JSON.parse(JSON.stringify(o.pending)) : null; S.pendingSel = (o.pendingSel||[]).slice(); }
  n += dedupe();
  S.studySel = S.studySel.filter(id => S.sits[id]);
  stamp(false);
  S.savedAt = Math.max(S.savedAt||0, o.savedAt||0) + 1; saveLocal(); queuePush(); updateDue();
  return n;
}
/* 주고받기 파일 */
function syncPayload(){ return JSON.stringify({app:"nihongo-cards", kind:"sync", from: PHONE ? "phone" : "workshop", at: Date.now(), state: S, key: PHONE ? undefined : (drillKey() || undefined)}); }
function syncName(){ const d = new Date(), p = x => String(x).padStart(2,"0"); return `일본어카드_${PHONE?"폰앱":"작업실"}_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.json`; }
async function sendSyncFile(){

}

const cloud = {col:null, last:{}, timer:0, busy:false, again:false, ok:false};
function syncText(t){ const el = $("#sync"); if (el) el.textContent = t; }
function cloudDocs(){
  const docs = {meta:{savedAt:S.savedAt, v:2, sits:S.sits, deleted:S.deleted, studySel:S.studySel, pending:S.pending, pendingSel:S.pendingSel}};
  Object.values(S.cards).forEach(c => { if (!S.sits[c.sid]) return; const k = "c-"+c.sid; (docs[k] = docs[k] || {cards:{}}).cards[c.id] = c; });
  return docs;
}
function queuePush(){ if (!cloud.col) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(push, 1500); }
async function push(){
  if (!cloud.col) return;
  if (cloud.busy) { cloud.again = true; return; }
  if (!navigator.onLine) { syncText("오프라인 · 연결되면 자동 백업"); return; }
  cloud.busy = true; syncText("자동 백업 중…");
  try {
    const docs = cloudDocs();
    for (const [id, body] of Object.entries(docs)) {
      const j = JSON.stringify(body);
      if (cloud.last[id] !== j) { await cloud.col.doc(id).set(JSON.parse(j)); cloud.last[id] = j; }
    }
    for (const id of Object.keys(cloud.last)) if (!docs[id]) { await cloud.col.doc(id).delete(); delete cloud.last[id]; }
    syncText(`자동 백업됨 ${when(Date.now()).split(" ")[1]}`);
  } catch(e) {
    syncText(e && e.code==="quota_exceeded" ? "백업 공간이 가득 찼어요" : "백업 대기 중 · 다시 시도해요");
  } finally {
    cloud.busy = false;
    if (cloud.again) { cloud.again = false; queuePush(); }
  }
}
addEventListener("online", queuePush);
async function startCloud(db, user){
  try {
    const id = user && await user.id(); if (!db || !id) { syncText("이 기기에만 저장돼요"); return; }
    cloud.col = db.collection("data/users/" + id);
    syncText("백업 확인 중…");
    const snap = await cloud.col.get();
    const got = {}; snap.docs.forEach(d => { if (d.exists) got[d.id] = d.data(); });
    const meta = got.meta;
    Object.keys(got).forEach(k => cloud.last[k] = JSON.stringify(got[k]));
    if (meta) {
      const cards = {}; Object.keys(got).filter(k=>k.startsWith("c-")).forEach(k => Object.assign(cards, JSON.parse(JSON.stringify(got[k].cards||{}))));
      const n = mergeState({savedAt:meta.savedAt, sits:JSON.parse(JSON.stringify(meta.sits||{})), cards, deleted:JSON.parse(JSON.stringify(meta.deleted||{})), studySel:(meta.studySel||[]).slice(), pending:meta.pending?JSON.parse(JSON.stringify(meta.pending)):null, pendingSel:(meta.pendingSel||[]).slice()});
      if (n > 0) { render(); toast("자동 백업의 기록을 합쳤어요"); }
    }
    await push();
  } catch(e) { syncText("이 기기에만 저장 중"); }
}

const GEN_RULES = `너는 일본 현지 비즈니스 일본어 교재 편집자다.

async function genSentences(name, desc, signal){
  const existing = Object.values(S.cards).filter(c => S.sits[c.sid] && S.sits[c.sid].name===name).map(c=>c.ja);
  const prompt = `${GEN_RULES}

업무 상황(한국어): ${name}${desc?`\n상황 설명: ${desc}`:""}

JSON 배열(10개)만 답하라.`;

function hl(text, words, side){
  text = String(text||"");
  const keys = (words||[]).map(w => w[side]).filter(Boolean).sort((a,b)=>b.length-a.length);
  const marks = new Array(text.length).fill(false);
  keys.forEach(k => { let i = text.indexOf(k); while (i >= 0) { let free = true; for (let j=i;j<i+k.length;j++) if (marks[j]) free=false; if (free) for (let j=i;j<i+k.length;j++) marks[j]=true; i = text.indexOf(k, i+k.length); } });
  let out = "", open = false;
  for (let i=0;i<text.length;i++){ if (marks[i] && !open){out+="<mark>";open=true;} if(!marks[i]&&open){out+="</mark>";open=false;} out+=esc(text[i]); }
  if (open) out += "</mark>"; return out;
}

function swipe(el, h){
  let sx, sy, dx=0, dy=0, on=false, id;
  el.addEventListener("pointerdown", e => { if (e.target.closest("button,textarea,input")) return; on=true; id=e.pointerId; sx=e.clientX; sy=e.clientY; dx=dy=0; el.classList.add("dragging"); try{el.setPointerCapture(id);}catch(_){} });
  el.addEventListener("pointermove", e => { if(!on) return; dx=e.clientX-sx; dy=e.clientY-sy;
    const tx = (h.left && h.right) ? dx : h.left ? Math.min(dx, 40) : h.right ? Math.max(dx, -40) : 0, ty = (h.up||h.down) ? dy : 0;
    el.style.transform = `translate(${tx}px,${ty}px) rotate(${tx/25}deg)`; });
  const end = () => { if(!on) return; on=false; el.classList.remove("dragging");
    const T = 70;
    if (Math.abs(dx) < 6 && Math.abs(dy) < 6) { el.style.transform = ""; h.tap && h.tap(); return; }
    if (h.up && dy < -T && Math.abs(dy) > Math.abs(dx)) return fly(el, 0, -600, h.up);
    if (h.down && dy > T && Math.abs(dy) > Math.abs(dx)) return fly(el, 0, 600, h.down);
    if (h.left && dx < -T && Math.abs(dx) > Math.abs(dy)) return fly(el, -600, 0, h.left);
    if (h.right && dx > T && Math.abs(dx) > Math.abs(dy)) { if (!h.rightOk || h.rightOk()) return fly(el, 600, 0, h.right); h.rightNo && h.rightNo(); }
    el.style.transform = ""; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", () => { on=false; el.classList.remove("dragging"); el.style.transform=""; });
}
function fly(el, x, y, cb){ el.style.transform = `translate(${x}px,${y}px)`; el.style.opacity = "0"; setTimeout(cb, 220); }

const pkOpen = {};
function picker({key, title, items, selected, onChange, openDefault=false}){
  if (pkOpen[key] === undefined) pkOpen[key] = openDefault;
  let sel = selected.slice();
  const wrap = document.createElement("div"); wrap.className = "picker";
  const bid = "pk-" + key;
  wrap.innerHTML = `<button class="pk-head" type="button" aria-expanded="${pkOpen[key]}" aria-controls="${bid}"><b>${esc(title)}</b><span class="pk-sum"></span>${CHEV}</button>
    <div class="pk-body" id="${bid}" ${pkOpen[key]?"":"hidden"}>
      <label class="pk-row all"><span class="lbl">전체선택</span><input class="sw" type="checkbox" role="switch" id="${bid}-all" data-all></label>
      <div class="pk-list">${items.map(i => `<label class="pk-row"><span class="lbl">${esc(i.name)}${i.n!=null?`<span class="n">${i.n}</span>`:""}${i.desc?`<small>${esc(i.desc)}</small>`:""}</span><input class="sw" type="checkbox" role="switch" id="${bid}-${esc(i.id)}" data-id="${esc(i.id)}"></label>`).join("")}</div>
      ${items.length > 5 ? `<div class="pk-more">위아래로 스크롤해서 더 보기 · ${items.length}개</div>` : ""}
    </div>`;
  const sync = () => {
    wrap.querySelectorAll("input[data-id]").forEach(i => i.checked = sel.includes(i.dataset.id));
    const all = wrap.querySelector("[data-all]"); all.checked = items.length > 0 && sel.length === items.length; all.indeterminate = sel.length > 0 && sel.length < items.length;
    wrap.querySelector(".pk-sum").textContent = `${sel.length}/${items.length} 선택`;
  };
  wrap.querySelector(".pk-head").onclick = e => { pkOpen[key] = !pkOpen[key]; e.currentTarget.setAttribute("aria-expanded", pkOpen[key]); wrap.querySelector(".pk-body").hidden = !pkOpen[key]; };
  wrap.addEventListener("change", e => {
    const i = e.target; if (!i.matches("input")) return;
    if (i.hasAttribute("data-all")) sel = i.checked ? items.map(x=>x.id) : [];
    else sel = i.checked ? [...new Set(sel.concat(i.dataset.id))] : sel.filter(x => x !== i.dataset.id);
    sync(); onChange(sel.slice());
  });
  sync(); return wrap;
}

const undo = {study:[], review:[]};

function pushUndo(kind, c){ undo[kind].push({id:c.id, snap:JSON.parse(JSON.stringify(c))}); if (undo[kind].length > 50) undo[kind].shift(); }
function popUndo(kind){
  while (undo[kind].length){
    const u = undo[kind].pop(), c = S.cards[u.id];
    if (!c) continue;
    const shows = c.shows; Object.assign(c, u.snap); c.shows = shows;

  }
  return null;
}

function drawDeck(stage){

  if (!deck.length){
    stage.innerHTML = `<div class="empty"><strong>선택한 상황의 카드를 모두 외웠어요</strong>퀴즈를 풀면 망각주기에 맞춰 복습 카드가 나와요.<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="reset">외운 카드 다시 공부하기</button></div>${undo.study.length ? '<p class="note" style="margin-top:10px">→ 오른쪽으로 밀면 방금 넘긴 카드가 다시 나와요</p>' : ""}</div>`;

  }

  const again = () => { pushUndo("study", c); c.status="again"; c.order = Math.max(...deck.map(d=>d.order)) + 1; save(); drawDeck(stage); };
  const known = () => { pushUndo("study", c); c.status="known"; save(); toast("외운 카드 목록에 넣었어요"); drawDeck(stage); };

function listen(SR, lang, box, msg, btn){

async function grade(c, said, what, signal){
  const prev = c.fb ? `\n이 카드에서 지난번 틀렸을 때의 해설(${c.fb.level}차): 어디:${c.fb.where} / 왜:${c.fb.why} / 기억법:${c.fb.tip}\n이번에 또 틀렸다면 해설을 한 단계 업그레이드하라: 같은 말 반복 금지, 다른 각도의 설명과 더 강력한 새 암기법을 줘라.` : "";
  const prompt = `너는 일본어 비즈니스 회화 채점관이다. 학습자는 한국인이다.
문제(${what==="ko"?"한국어 뜻을 보고 일본어로 말하기":"일본어 문장을 보고 한국어 뜻 말하기"}): ${what==="ko"?c.ko:c.ja}
모범 답: ${what==="ko"?c.ja:c.ko}
(참고: 일본어 ${c.ja} / 한국어 ${c.ko})
학습자가 말한 답(음성 인식 결과라 오타·띄어쓰기·한자/가나 표기 차이는 무시): ${said}
채점 기준: 모범 답과 완전히 같지 않아도 뜻과 뉘앙스(정중함 수준 포함)가 같으면 정답. 뜻이 달라지거나, 비즈니스 상황에서 어색하거나 실례가 되면 오답. 일본어 표현은 표준어 기준.${prev}
JSON 객체 하나만 답하라:
{"correct":true/false,
 "comment":"정답일 때 한 줄 칭찬 또는 더 자연스러운 표현(짧게, 없으면 빈 문자열)",
 "where":"오답일 때: 학습자 답의 어느 부분이 틀렸는지(한국어)",
 "why":"오답일 때: 왜 틀렸거나 어색한지(한국어, 2~3문장)",
 "tip":"오답일 때: 올바른 문장을 쉽게 기억하는 방법(한국어, 연상법·말장난·구조 분해 등)",
 "myCard":${what==="ja"?'오답이면 학습자가 말한 한국어 문장을 일본 비즈니스 표준어로 옮긴 카드 {"ja":"","pron":"한국어 발음 표기","ko":"학습자가 말한 한국어 문장 그대로","words":[{"ja":"","ko":""}]}, 정답이면 null':"null"}}`;
  const r = await sample.json(prompt, {signal, cache:false, effort:"low"});
  if (!r || typeof r !== "object") throw {code:"invalid_json"};
  r.correct = r.correct === true || r.correct === "true";
  return r;
}

let AIDX = null, D = null;
async function audioIndex(){

/* 비공개 카드 음성: 암호화된 파일을 받아 이 폰에서 풀어서 재생한다 */
var WS_KEY = ""; 
function drillKey(){ if (WS_KEY) return WS_KEY; try { return localStorage.getItem("jd-key") || ""; } catch(e){ return ""; } }
let PIDX = null, cryptoKeys = null;
async function keys(){
  const k = drillKey(); if (!k || !window.crypto || !crypto.subtle) return null;
  if (cryptoKeys && cryptoKeys.k === k) return cryptoKeys;
  try {
    const raw = Uint8Array.from(atob(k), ch => ch.charCodeAt(0));
    cryptoKeys = {k, aes: await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]),
      mac: await crypto.subtle.importKey("raw", raw, {name:"HMAC", hash:"SHA-256"}, false, ["sign"])};
    return cryptoKeys;
  } catch(e) { return null; }
}
async function privIndex(){
  if (!PHONE) return {files:{}};
  if (PIDX) return PIDX;
  try { const r = await fetch("paudio/index.json", {cache:"no-cache"}); PIDX = r.ok ? await r.json() : {files:{}}; } catch(e){ PIDX = {files:{}}; }
  if (!PIDX.files) PIDX = {files:{}};
  return PIDX;
}
async function pidOf(ja, ks){ const sig = await crypto.subtle.sign("HMAC", ks.mac, new TextEncoder().encode(String(ja).trim())); return [...new Uint8Array(sig)].map(x => x.toString(16).padStart(2,"0")).join("").slice(0,16); }
const blobUrls = new Map();
async function decryptTo(url, ks){
  if (blobUrls.has(url)) return blobUrls.get(url);
  const r = await fetch(url); if (!r.ok) throw new Error("fetch");
  const b = new Uint8Array(await r.arrayBuffer());
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b.slice(0,12)}, ks.aes, b.slice(12));
  const u = URL.createObjectURL(new Blob([pt], {type:"audio/mpeg"})); blobUrls.set(url, u); return u;
}
const curVoice = idx => (idx.voices && idx.voices[S.voice]) ? S.voice : (idx.default || Object.keys(idx.voices||{})[0] || "");
async function audioFor(ja){
  const idx = await audioIndex(), v = curVoice(idx);
  if (!v) return null;
  let h = ""; try { h = await hashJa(ja); } catch(e){ return null; }
  const f = idx.files[v] && idx.files[v][h];
  if (f) { const src = `audio/${v}/${h}.mp3`; return {getSrc: async () => src, starts:f.starts, len:f.len, voice:v}; }
  const ks = await keys(); if (!ks) return null;
  const pidx = await privIndex(), p = await pidOf(ja, ks), pf = pidx.files[v] && pidx.files[v][p];
  if (!pf) return null;
  const url = `paudio/${v}/${p}.bin`;
  return {getSrc: () => decryptTo(url, ks), starts:pf.starts, len:pf.len, voice:v};
}
/* 고른 목소리의 음성 파일을 폰에 미리 저장 (인터넷이 있을 때만) */
async function warmAudio(){
  if (!PHONE || !navigator.onLine || !("caches" in window)) return;
  try {
    const idx = await audioIndex(), v = curVoice(idx); if (!v) return;
    const c = await caches.open("drill-audio");
    for (const h of Object.keys(idx.files[v] || {})) {
      const u = new URL(`audio/${v}/${h}.mp3`, location.href).href;
      if (!(await c.match(u))) { try { const r = await fetch(u); if (r.ok) await c.put(u, r); } catch(e){} }
    }
    if (await keys()) {
      const pidx = await privIndex();
      for (const h of Object.keys(pidx.files[v] || {})) {
        const u = new URL(`paudio/${v}/${h}.bin`, location.href).href;
        if (!(await c.match(u))) { try { const r = await fetch(u); if (r.ok) await c.put(u, r); } catch(e){} }
      }

}
/* 카드의 '일본어 듣기': 고른 목소리 파일이 있으면 그 목소리로 한 번, 없으면 기기 음성 */
let clipAudio = null, clipStop = 0;
async function speakCard(ja){
  const a = PHONE ? await audioFor(ja) : null;

}
async function hashJa(t){

  };
  if (inp) inp.onchange = async e => {
    const f = e.target.files && e.target.files[0], log = $("#inLog"); if (!f) return;
    try { const r = await receiveSyncFile(f); log.textContent = r.n ? `카드와 기록 ${r.n}건을 합쳤어요.` : "이미 같은 기록이라 바뀐 게 없어요."; updateDue(); }
    catch(_){ log.textContent = "이 앱의 기록 파일이 아니에요."; }
    e.target.value = "";
  };
}

  <div class="panel"><h3>공부하고 싶은 상황 직접 입력</h3>
    <input class="field" id="sitIn" placeholder="예: 거래처 미팅 일정 잡기" maxlength="80">

      text = text.trim().slice(0, 40000);

JSON 배열만 답하라: [{"name":"","desc":""}]

자료:
${text}`, {signal:busy.signal});

function drawPending(){
  const box = $("#pending"); if (!box) return; box.innerHTML = "";
  if (!S.pending || !S.pending.items.length) return;
  const status = document.createElement("div");
  box.append(picker({key:"pending", openDefault:true, title:`추출한 업무 · ${S.pending.src}`, items:S.pending.items, selected:S.pendingSel,
    onChange: sel => { S.pendingSel = sel; save(); drawBtn(); }}));
  box.append(status);
  const drawBtn = () => {
    const n = S.pendingSel.length;
    status.innerHTML = `<div class="row" style="margin-top:10px"><button class="btn primary" id="mk" style="flex:1" ${n&&online()?"":"disabled"}>켠 업무 ${n}개로 문장 만들기</button><button class="btn" id="clr">목록 닫기</button></div><p class="log" id="mkLog"></p>`;
    $("#clr").onclick = () => { S.pending = null; S.pendingSel = []; save(); drawPending(); };
    $("#mk").onclick = make;
  };
  const make = async () => {
    if (busy) return; busy = new AbortController(); const log = $("#mkLog"); $("#mk").disabled = true;
    const todo = S.pending.items.filter(i => S.pendingSel.includes(i.id)); let done = 0, fail = [];
    for (const it of todo){
      log.textContent = `${done+1}/${todo.length} ‘${it.name}’ 필수 문장 고르는 중…`;
      try { const list = await genSentences(it.name, it.desc, busy.signal); addSentences(it.name, it.desc, list, S.pending.src);
        S.pending.items = S.pending.items.filter(x=>x.id!==it.id); S.pendingSel = S.pendingSel.filter(x=>x!==it.id); save(); done++; }
      catch(e){ if (e && e.code==="cancelled") break; fail.push(it.name); if (e && (e.code==="not_granted"||e.code==="rate_limited"||e.code==="sampling_disabled")) { break; } }
    }
    busy = null;
    drawPending();
    const l2 = $("#mkLog") || $("#exLog");
    l2.textContent = `${done}개 업무의 카드를 만들었어요. 공부 탭에서 확인하세요.${fail.length?`\n만들지 못한 업무: ${fail.join(", ")} (다시 눌러 주세요)`:""}`;
  };
  drawBtn();
}
const libs = {};
function loadLib(src){ return libs[src] || (libs[src] = new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => { delete libs[src]; no({code:"lib", msg:"파일을 읽는 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."}); }; document.head.append(s); })); }
async function readFile(f){
  const ext = (f.name.split(".").pop()||"").toLowerCase();
  if (["txt","md"].includes(ext)) return await f.text();
  if (["xlsx","xls","csv"].includes(ext)){
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
    const wb = XLSX.read(await f.arrayBuffer(), {type:"array"});
    return wb.SheetNames.map(n => `# ${n}\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n");
  }
  if (ext === "docx"){
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    return (await mammoth.extractRawText({arrayBuffer: await f.arrayBuffer()})).value;
  }
  if (ext === "pdf"){
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    await loadLib("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js");
    const doc = await pdfjsLib.getDocument({data: new Uint8Array(await f.arrayBuffer()), isEvalSupported:false, disableFontFace:true}).promise;
    let out = ""; for (let p=1; p<=Math.min(doc.numPages, 40); p++){ const tc = await (await doc.getPage(p)).getTextContent(); out += tc.items.map(i=>i.str).join(" ") + "\n"; }
    return out;
  }
  throw {code:"type", msg:`${f.name}: 이 형식은 읽을 수 없어요.`};
}
